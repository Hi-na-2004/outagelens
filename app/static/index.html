<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OutageLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--mist:#EDF1F0;--paper:#fff;--ink:#12263A;--soft:#4A5F73;--teal:#0B7A75;--tealbg:#D5ECEA;--amber:#E8A23B;--blue:#2F5D8A;--line:#D4DDDC;--err:#B3412F}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
header{padding:40px 24px 8px;max-width:1100px;margin:0 auto}
header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--soft);max-width:60ch}
main{max-width:1100px;margin:0 auto;padding:16px 24px 64px;display:grid;grid-template-columns:320px 1fr;gap:24px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-weight:500;margin:14px 0 6px}
textarea,select,input[type=number]{width:100%;font:inherit;color:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:130px;resize:vertical}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:8px;font:inherit;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.check{display:flex;gap:8px;align-items:center;margin-top:14px}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:6px;border:1px solid var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.55;cursor:wait}
.ribbon{height:14px;display:flex;border-radius:7px;overflow:hidden;background:var(--line);margin:10px 0 8px}
.ribbon i{display:block;height:100%;transition:width .35s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--soft)}
.legend b{font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card{margin-top:14px}
.card h3{font-size:1.15rem}
.card h3 a{color:var(--ink);text-decoration-color:var(--amber);text-underline-offset:3px}
.meta{color:var(--soft);font-size:.9rem;margin:4px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--tealbg);color:var(--teal);padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:500}
dl{margin:10px 0 0;display:grid;grid-template-columns:110px 1fr;gap:6px 14px}
dt{color:var(--soft);font-size:.9rem}dd{margin:0}
details{margin-top:12px;color:var(--soft)}details p{margin:8px 0 0;font-size:.92rem}
.answer{border-left:5px solid var(--teal)}
.answer sup{color:var(--teal);font-weight:700}
.empty,.error{color:var(--soft);padding:28px 4px}
.error{color:var(--err)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>OutageLens</h1>
  <p>Describe what is breaking in plain words. OutageLens finds public incident reports that look like it and shows how those teams found and fixed the cause.</p>
</header>
<main>
  <section class="panel" aria-label="Search settings">
    <label for="q">What is going wrong?</label>
    <textarea id="q" placeholder="Latency tripled ten minutes after a deploy and the database connection pool is full"></textarea>
    <label id="modeLabel">Search method</label>
    <div class="seg" role="group" aria-labelledby="modeLabel" id="mode">
      <button aria-pressed="false" data-m="vector">Meaning</button>
      <button aria-pressed="false" data-m="keyword">Keywords</button>
      <button aria-pressed="true" data-m="hybrid">Both</button>
    </div>
    <div class="check"><input type="checkbox" id="rerank"><label for="rerank" style="margin:0;font-weight:400">Re-rank the best matches (slower, more precise)</label></div>
    <label for="cat">Cause of incident</label>
    <select id="cat"><option value="">Any cause</option></select>
    <label for="k">Number of incidents</label>
    <input type="number" id="k" min="1" max="20" value="5">
    <div class="row">
      <button class="btn primary" id="go">Find similar incidents</button>
      <button class="btn ghost" id="ask">Explain it</button>
    </div>
  </section>
  <section aria-live="polite">
    <div class="panel" id="timing" hidden>
      <h2 style="font-size:1.05rem">Where the time went</h2>
      <div class="ribbon" id="ribbon"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div id="out"><p class="empty">Results will appear here. Try the example in the box, or describe your own problem.</p></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?u:"#";
const STAGES=[["embed_ms","Embedding","#0B7A75"],["vector_ms","Vector search","#2F5D8A"],["keyword_ms","Keyword search","#7A8CA3"],["fuse_ms","Fusion","#C9D3DC"],["rerank_ms","Re-rank","#E8A23B"],["db_fetch_ms","Load details","#12263A"]];
let mode="hybrid";
$("#mode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;
  document.querySelectorAll("#mode button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
fetch("/api/meta").then(r=>r.json()).then(m=>{m.categories.forEach(c=>{const o=document.createElement("option");
  o.value=c.category;o.textContent=`${c.category.replace(/_/g," ")} (${c.n})`;$("#cat").appendChild(o);});}).catch(()=>{});

function body(){return{query:$("#q").value.trim(),top_k:+$("#k").value||5,category:$("#cat").value||null}}
function busy(on){$("#go").disabled=$("#ask").disabled=on}
function ribbon(t){
  const total=t.total_ms||1;$("#timing").hidden=false;
  $("#ribbon").innerHTML=STAGES.filter(s=>t[s[0]]!=null).map(s=>`<i title="${s[1]}" style="width:${t[s[0]]/total*100}%;background:${s[2]}"></i>`).join("");
  $("#legend").innerHTML=STAGES.filter(s=>t[s[0]]!=null).map(s=>`<span><span class="dot" style="background:${s[2]}"></span>${s[1]} <b class="mono">${t[s[0]]} ms</b></span>`).join("")+`<span>Total <b class="mono">${t.total_ms} ms</b></span>`;
}
function card(r,i){
  const f=(k,l)=>r[k]&&r[k]!=="not stated"?`<dt>${l}</dt><dd>${esc(r[k])}</dd>`:"";
  return `<article class="panel card"><h3>[${i}] <a href="${esc(safe(r.url))}" target="_blank" rel="noopener">${esc(r.title)}</a></h3>
  <div class="meta"><span class="chip">${esc((r.category||"").replace(/_/g," "))}</span><span>${esc(r.company||"")} ${r.year||""}</span><span class="mono">score ${r.score}</span></div>
  <dl>${f("root_cause","Root cause")}${f("detection","How it was found")}${f("mitigation","How it was fixed")}${f("prevention","Prevention")}</dl>
  <details><summary>Matched passage</summary><p>${esc(r.passage)}</p></details></article>`;
}
async function call(path,payload){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail?JSON.stringify(e.detail):r.statusText)}
  return r.json();
}
async function run(kind){
  const b=body();if(b.query.length<3){$("#out").innerHTML='<p class="error">Write at least a few words about the problem.</p>';return}
  busy(true);$("#out").innerHTML='<p class="empty">Searching…</p>';
  try{
    if(kind==="search"){
      const d=await call("/api/search",{...b,mode,rerank:$("#rerank").checked});
      ribbon(d.timings_ms);
      $("#out").innerHTML=d.results.length?d.results.map((r,i)=>card(r,i+1)).join(""):'<p class="empty">No similar incidents. Try fewer filters or describe the symptoms differently.</p>';
    }else{
      const d=await call("/api/ask",b);ribbon(d.timings_ms);
      const text=esc(d.answer).replace(/\[(\d+)\]/g,"<sup>[$1]</sup>").replace(/\n/g,"<br>");
      $("#out").innerHTML=`<article class="panel answer"><h2 style="font-size:1.1rem">Answer <span class="chip">${d.answer_mode==="llm"?"written by the model":"from stored fields"}</span></h2><p>${text}</p></article>`+d.sources.map((r,i)=>card(r,i+1)).join("");
    }
  }catch(e){$("#out").innerHTML=`<p class="error">Request failed: ${esc(e.message)}. Check that the API and database are running.</p>`}
  busy(false);
}
$("#go").onclick=()=>run("search");$("#ask").onclick=()=>run("ask");
</script>
</body>
</html>
