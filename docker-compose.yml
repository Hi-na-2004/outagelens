services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: outage
      POSTGRES_PASSWORD: outage_dev
      POSTGRES_DB: outagelens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage -d outagelens"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://outage:outage_dev@db:5432/outagelens
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./data:/srv/data
      - ./eval:/srv/eval
      - ./results:/srv/results
      - hfcache:/srv/.hf

  ollama:            # optional: docker compose --profile local-llm up
    image: ollama/ollama
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  hfcache:
  ollama:
